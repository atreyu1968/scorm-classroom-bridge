{% extends 'base.html' %}{% block title %}Subir SCORM{% endblock %}{% block content %}<div class="card form-card"><h1>Importar paquete SCORM</h1><p class="muted">El sistema localizará <code>imsmanifest.xml</code>, detectará SCORM 1.2/2004 y calculará el recurso inicial.</p><form method="post" enctype="multipart/form-data"><div class="field"><label>Archivo ZIP SCORM</label><input required type="file" name="scorm_zip" accept=".zip"></div><div class="field"><label>Título opcional</label><input name="title" placeholder="Se usará el título del manifiesto si queda vacío"></div><div class="form-row"><div class="field"><label>Nota mínima (%)</label><input type="number" name="pass_score" min="0" max="100" value="70"></div><div class="field"><label>Puntos en Classroom</label><input type="number" name="max_points" min="1" value="100"></div></div><div class="form-row"><div class="field"><label>Intentos máximos</label><input type="number" name="max_attempts" min="0" value="0"><small class="muted">0 = ilimitados</small></div><div class="field"><label>Límite de pérdidas de foco</label><input type="number" name="focus_limit" min="0" value="0"><small class="muted">0 = registrar sin cerrar</small></div></div><div class="field"><label>Prerrequisito</label><select name="prerequisite_id"><option value="">Ninguno</option>{% for p in packages %}<option value="{{ p.id }}">{{ p.title }}</option>{% endfor %}</select></div><label class="check"><input type="checkbox" name="fullscreen"> Solicitar pantalla completa al comenzar</label><div style="margin-top:22px"><button class="btn btn-primary" type="submit">Importar SCORM</button></div></form></div>{% endblock %}
