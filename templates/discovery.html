<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"><title>Seleccionar SCORM</title></head><body class="addon-shell"><header class="addon-header"><div><strong>SCORM Classroom Bridge</strong><div class="meta">Selecciona una actividad para adjuntarla</div></div><a class="btn btn-secondary" target="_blank" href="{{ url_for('upload_package') }}">+ Subir</a></header>{% for p in packages %}<div class="package-choice"><div><strong>{{ p.title }}</strong><div class="meta">SCORM {{ p.scorm_version }} · {{ p.max_points }} puntos · aprobado {{ p.pass_score|int }}%</div></div><form method="post" action="{{ url_for('attach_package',package_id=p.id) }}"><button class="btn btn-primary" type="submit">Adjuntar</button></form></div>{% else %}<div class="empty">No hay SCORM disponibles. Abre la plataforma y sube un paquete.</div>{% endfor %}</body></html>
