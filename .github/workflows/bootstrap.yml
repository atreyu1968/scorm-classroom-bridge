name: Bootstrap repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild repository from prepared release
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/scorm-bridge.zip
          unzip -t /tmp/scorm-bridge.zip
          mkdir -p /tmp/scorm-bridge
          unzip -q /tmp/scorm-bridge.zip -d /tmp/scorm-bridge
          cp -a /tmp/scorm-bridge/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish SCORM Classroom Bridge LMS 3.0"
          git push
