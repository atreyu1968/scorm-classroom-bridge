services:
  scorm-classroom:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - scorm-net

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      scorm-classroom:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - scorm-net

networks:
  scorm-net:

volumes:
  caddy_data:
  caddy_config:
