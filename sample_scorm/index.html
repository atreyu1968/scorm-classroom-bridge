<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCORM de prueba</title><style>body{font-family:system-ui;background:#f5f7fb;color:#182238;margin:0;padding:40px}.box{max-width:760px;margin:auto;background:white;padding:32px;border-radius:18px;box-shadow:0 10px 35px #2233aa16}button{background:#155eef;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer}.q{margin:24px 0}.ok{color:#087443}</style></head><body><div class="box"><h1>Prueba del reproductor SCORM</h1><p>Esta actividad confirma que el runtime SCORM 1.2, el guardado y la calificación funcionan.</p><div class="q"><p><b>¿Qué estándar está ejecutando esta actividad?</b></p><label><input type="radio" name="q" value="0"> PDF</label><br><label><input type="radio" name="q" value="100"> SCORM 1.2</label><br><label><input type="radio" name="q" value="0"> LTI</label></div><button onclick="finish()">Entregar actividad</button><p id="msg"></p></div><script>
var api=null;try{api=window.parent.API}catch(e){};if(api){api.LMSInitialize('');api.LMSSetValue('cmi.core.lesson_status','incomplete');}
function finish(){var el=document.querySelector('input[name=q]:checked');if(!el){alert('Selecciona una respuesta.');return;}var score=el.value;api.LMSSetValue('cmi.core.score.raw',score);api.LMSSetValue('cmi.core.score.min','0');api.LMSSetValue('cmi.core.score.max','100');api.LMSSetValue('cmi.core.lesson_status',score==='100'?'passed':'failed');api.LMSCommit('');api.LMSFinish('');document.getElementById('msg').innerHTML='<span class="ok">Entregado. Puntuación: '+score+'%</span>';}
</script></body></html>
